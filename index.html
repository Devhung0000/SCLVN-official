<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:url" content="https://thespamchallengelistvietnam.pages.dev/"/>
        <meta property="og:title" content="The Spam Challenge List Vietnam" />
        <meta property="og:description" content="This is a website for the hardest spam challenges in Vietnam!" />
        <meta property="og:image" content="https://thespamchallengelistvietnam2.pages.dev/assets/the%20sclvn%20logo.png" />
        <title>The Spam Challenge List Vietnam</title>

        <link rel="icon" href="/assets/the sclvn logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />

        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script>
            window.SCLVN_RAW_UPLOAD_ENDPOINT =
                "https://sclvn-raw-upload.thespamchallengelistvietnam.workers.dev/upload-session";
        </script>
        <script type="module" src="/js/main.js"></script>
    </head>

    <body id="app">
        <aside class="app-sidebar">
            <div>
                <nav class="sidebar-nav">
                    <router-link class="sidebar-item" to="/" title="List">
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4.5h6"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg></span>
                        <span class="sidebar-label">List</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/leaderboard" title="Leaderboard">
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"></path><path d="M8 6H5v1a4 4 0 0 0 4 4M16 6h3v1a4 4 0 0 1-4 4"></path><path d="M12 11v5M9 20h6M10 16h4"></path></svg></span>
                        <span class="sidebar-label">Leaderboard</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/roulette" title="Roulette">
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M7 9h10v6H7z"></path><path d="M8 12h.01M12 12h.01M16 12h.01"></path><path d="M18 5V3h2"></path></svg></span>
                        <span class="sidebar-label">Roulette</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/submit" title="Submit Record">
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 14v5h14v-5"></path></svg></span>
                        <span class="sidebar-label">Submit</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/bug-report" title="Bug Report">
                        <span class="sidebar-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 8h6"></path>
                                <path d="M9 12h6"></path>
                                <path d="M10 4h4l1 3H9l1-3Z"></path>
                                <rect x="6" y="7" width="12" height="13" rx="5"></rect>
                                <path d="M3 10h3M18 10h3M3 15h3M18 15h3"></path>
                            </svg>
                        </span>
                        <span class="sidebar-label">Bug Report</span>
                    </router-link>

                    <router-link
                        v-if="store.user && store.user.role === 'admin'"
                        class="sidebar-item sidebar-item-admin"
                        to="/admin"
                        title="Duyệt Record"
                    >
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.8 8.2 7 10 4.2-1.8 7-5.4 7-10V6l-7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
                        <span class="sidebar-label">Duyệt Record</span>
                    </router-link>

                    <router-link
                        v-if="store.user && store.user.role === 'admin'"
                        class="sidebar-item sidebar-item-admin"
                        to="/admin/bug-reports"
                        title="Bug Reports"
                    >
                        <span class="sidebar-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 8h6M9 12h6"></path>
                                <rect x="6" y="5" width="12" height="15" rx="3"></rect>
                                <path d="M10 3h4"></path>
                            </svg>
                        </span>
                        <span class="sidebar-label">Bug Reports</span>
                    </router-link>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a class="sidebar-item" href="https://discord.gg/Qcj5JSRKa" target="_blank" rel="noopener noreferrer" title="Discord Server">
                    <span class="sidebar-icon">
                        <img src="/assets/discord.svg" alt="Discord" />
                    </span>
                    <span class="sidebar-label">Discord Server</span>
                </a>

                <div v-if="!store.user">
                    <router-link to="/login" class="sidebar-item sidebar-login" title="Login / Register">
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h8M17 12v3M20 12v2"></path></svg></span>
                        <span class="sidebar-label">Login / Register</span>
                    </router-link>
                </div>

                <template v-else>
                    <button @click="store.handleLogout()" class="sidebar-item sidebar-logout" title="Logout">
                        <span class="sidebar-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5"></path><path d="M14 8l4 4-4 4M18 12H9"></path></svg></span>
                        <span class="sidebar-label">Logout</span>
                    </button>
                </template>
            </div>
        </aside>

        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left">
                    <router-link to="/" class="topbar-brand">
                        <img src="/assets/the sclvn logo.png" alt="SCLVN Logo" class="topbar-logo" />
                        <div class="topbar-brand-text">
                            <h2>SCLVN</h2>
                            <span>v3.0</span>
                        </div>
                    </router-link>
                </div>

                <div class="topbar-center">
                    <form class="topbar-search" @submit.prevent="handleGlobalSearch">
                        <span class="topbar-search-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg></span>
                        <input
                            id="global-search"
                            v-model="globalSearchQuery"
                            type="search"
                            autocomplete="off"
                            placeholder="Search levels..."
                            aria-label="Search levels"
                        />
                        <span class="topbar-shortcut">Ctrl K</span>
                    </form>
                </div>

                <div class="topbar-right">
                    <router-link to="/submit" class="topbar-btn">Submit Record</router-link>

                    <a href="https://discord.gg/NgFFEuqPvz" target="_blank" rel="noopener noreferrer" class="topbar-icon-btn" title="Discord">
                        <img src="/assets/discord.svg" alt="Discord" />
                    </a>

                    <router-link v-if="store.user" to="/profile" class="topbar-user">
                        <img :src="store.user.avatar || '/assets/the sclvn logo.png'" alt="Avatar" />
                        <span class="topbar-user-meta">
                            <span class="topbar-username">{{ store.user.username || 'Player' }}</span>
                            <span v-if="store.user.role === 'admin'" class="topbar-admin-label">ADMIN</span>
                        </span>
                    </router-link>

                    <router-link v-else to="/login" class="topbar-btn">Login</router-link>
                </div>
            </div>

            <div class="page-shell">
                <router-view></router-view>
            </div>
        </div>
    </body>
</html>
